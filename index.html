<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model benchmarks</title>
<style>
:root{--paper:#f7f6f2;--ink:#252723;--muted:#6f716b;--line:#dcded5;--sol:#53716a;--argon:#526d91;--opus:#9a664c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 Arial,Helvetica,sans-serif}main{max-width:1256px;margin:auto;padding:34px 48px 28px}a{color:inherit;text-underline-offset:4px}a:hover{color:var(--argon)}button,select{font:inherit;color:inherit}button,a,select{touch-action:manipulation}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--argon);outline-offset:4px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);padding-bottom:18px}.brand{font-weight:700;letter-spacing:-.4px}.top nav{display:flex;gap:26px}.top a{text-decoration:none;font-size:12px}.issue{font:11px/1.5 Consolas,monospace;letter-spacing:1px;color:var(--muted);text-transform:uppercase}.hero{padding:61px 0 43px;display:grid;grid-template-columns:1.6fr 1fr;gap:65px;align-items:end}h1{font:normal clamp(48px,6vw,78px)/1.03 Georgia,serif;letter-spacing:-3.5px;margin:15px 0 0}h1 em{color:var(--muted);font-weight:400}.intro{color:var(--muted);font-size:15px;max-width:360px;margin:0 0 4px}.scope{display:flex;gap:25px;margin-top:22px;font:11px Consolas,monospace;color:var(--ink)}.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:19px}h2{font:normal 27px/1.2 Georgia,serif;letter-spacing:-.6px;margin:0}h2 .number{font:11px Consolas,monospace;color:var(--muted);margin-right:15px;letter-spacing:0}.small{font-size:12px;color:var(--muted)}.charts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.chart{padding:24px 25px 18px;border-right:1px solid var(--line)}.chart:first-child{padding-left:0}.chart:last-child{border:0;padding-right:0}.modelhead{display:flex;justify-content:space-between;align-items:center}.modelhead h3{font-size:15px;letter-spacing:-.3px;margin:0}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--color);margin-right:9px}.modelhead span{font-size:11px;color:var(--muted)}svg{display:block;width:100%;height:auto;margin:18px 0 8px;overflow:visible}.chart p{font-size:12px;color:var(--muted);margin:4px 0 0}.chart strong{color:var(--ink);font-weight:400}.caption{font-size:12px;color:var(--muted);margin:13px 0 0}.results{margin-top:49px}.controls{display:flex;gap:22px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:18px 0;border-top:1px solid var(--ink)}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button{background:none;border:1px solid transparent;padding:7px 12px;cursor:pointer;font-size:12px}.tabs button.active{background:var(--ink);color:var(--paper)}select{background:transparent;border:0;border-bottom:1px solid var(--line);padding:7px 18px 7px 0;font-size:12px;cursor:pointer}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}th{text-align:right;font-weight:400;font-size:11px;color:var(--muted);border-bottom:1px solid var(--ink);padding:13px 12px;vertical-align:bottom}th:first-child,td:first-child{text-align:left;padding-left:0}td{padding:14px 12px;text-align:right;border-bottom:1px solid var(--line)}td:first-child{font-weight:600}td.level{color:var(--muted);font-weight:400;text-align:left}th:nth-child(2){text-align:left}th button{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:inherit}th button:hover{color:var(--ink)}.best{font-weight:700;text-decoration:underline;text-decoration-color:#b0b5a7;text-underline-offset:5px}.na{color:#94978d}.source{font-size:11px;color:var(--muted);font-weight:400;margin-left:9px;text-decoration:none}.count{margin-top:13px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px}.notes{margin-top:51px;padding-top:24px;border-top:1px solid var(--ink);display:grid;grid-template-columns:1fr 1fr;gap:58px}.notes h3{font-size:12px;margin:0 0 9px}.notes p{font-size:12px;color:var(--muted);margin:0 0 15px;max-width:520px}.notes ul{padding:0;list-style:none;margin:0}.notes li{font-size:12px;margin:7px 0;color:var(--muted)}footer{border-top:1px solid var(--line);margin-top:35px;padding-top:17px;display:flex;justify-content:space-between;font:10px Consolas,monospace;color:var(--muted);letter-spacing:.4px}.legend{display:flex;gap:12px;align-items:center}.legend i{display:inline-block;width:18px;border-top:2px solid var(--muted)}.notice{border-left:2px solid #a7ae9e;padding-left:12px}@media(max-width:800px){main{padding:24px}.hero{grid-template-columns:1fr;gap:25px;padding:40px 0 32px}h1{letter-spacing:-2px}.intro{max-width:520px}.charts{grid-template-columns:1fr}.chart,.chart:first-child,.chart:last-child{padding:23px 0;border-right:0;border-bottom:1px solid var(--line)}.chart:last-child{border:0}.chart svg{max-width:500px}.notes{grid-template-columns:1fr;gap:20px}.section-title{align-items:start;flex-direction:column;gap:8px}.scope{gap:18px}.top nav{gap:16px}}@media print{.controls{display:none}main{max-width:none;padding:12px}.hero{padding:22px 0}.table-wrap{overflow:visible}body{font-size:11px}.source{display:none}.notes{break-inside:avoid}th,td{padding:7px}h1{font-size:50px}}
.top{margin-bottom:24px}.metric-label{font-size:12px;color:var(--muted);margin-bottom:12px}.results{margin-top:28px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}</style>
</head>
<body><main>
<header class="top"><div class="brand">Model / Benchmarks</div><span class="small">October 25, 2026</span></header>
<section aria-label="Reasoning benchmark charts"><div class="metric-label">AA Intelligence Index</div><div class="charts" id="charts"></div></section>
<section class="results" id="results" aria-label="Benchmark results"><div class="controls"><div class="tabs" role="group" aria-label="Benchmark view"><button data-view="overview" class="active" aria-pressed="true">Overview</button><button data-view="coding" aria-pressed="false">Coding & reasoning</button><button data-view="work" aria-pressed="false">Knowledge & work</button></div><label class="small">Model&nbsp; <select id="filter"><option value="all">All models</option><option value="argon">Gemini 4 Argon</option><option value="sol">GPT-6.1 Sol</option><option value="opus">Claude Opus 5.5</option></select></label></div><div class="table-wrap" tabindex="0" aria-label="Scrollable benchmark results"><table><caption class="sr-only" id="table-caption"></caption><thead id="head"></thead><tbody id="rows"></tbody></table></div><div class="count"><span id="count" aria-live="polite"></span><span>— = unavailable in reviewed sources; never treated as zero.</span></div><noscript>Enable JavaScript to see the interactive tables and charts. All benchmark data is embedded in this file.</noscript></section>

</main>
<script>
const base='https://artificialanalysis.ai/models/comparisons/';
const sources={sm:base+'gpt-6-1-sol-vs-gpt-6-1-sol-medium',sl:base+'gpt-6-1-sol-low-vs-gpt-6-1-sol-xhigh',sh:base+'gpt-6-1-sol-high-vs-gpt-6-1-sol-low',ol:base+'claude-opus-5-5-vs-claude-opus-5-5-low',oh:base+'claude-opus-5-5-high-vs-claude-opus-5-5-xhigh',om:base+'claude-opus-5-5-medium-vs-claude-opus-5-high',ah:base+'gemini-4-argon-vs-gpt-5-6-terra-medium'};
const models={argon:{name:'Gemini 4 Argon',provider:'Google',color:'#526d91',game:'https://benchmarks.duellab.org/model-gemini-4-argon'},sol:{name:'GPT-6.1 Sol',provider:'OpenAI',color:'#53716a',game:'https://benchmarks.duellab.org/model-gpt-6-1-sol'},opus:{name:'Claude Opus 5.5',provider:'Anthropic',color:'#9a664c',game:'https://benchmarks.duellab.org/model-claude-opus-5-5'}};
// AA fields: index, Briefcase Elo, GDPval Elo, Automation %, Terminal %, SciCode %, HLE %, GDP.pdf %, CritPt %, Omniscience index, LCR %, USD/task.
const raw=[
['argon','Low',null,81,null],['argon','Medium',null,78.7,null],['argon','High',[53,1486,1624,78,57,62,57,22,27,42,80,1.99],90.1,'ah'],
['sol','Low',[42,1114,1316,53,31,53,47,27,25,38,84,.13],77.5,'sl'],['sol','Medium',[48,1359,1450,63,48,53,50,30,28,40,83,.21],87.3,'sm'],['sol','High',[50,1465,1512,64,52,56,51,32,30,41,82,.32],null,'sh'],['sol','Xhigh',[51,1502,1539,67,54,56,53,32,32,41,80,.39],92.7,'sl'],['sol','Max',[52,1555,1596,65,56,54,53,31,32,42,83,.72],null,'sm'],
['opus','Low',[42,1276,1234,53,31,59,48,26,18,39,81,.55],78,'ol'],['opus','Medium',[51,1624,1583,61,53,59,55,26,28,40,84,1.34],92.9,'om'],['opus','High',[54,1683,1704,63,57,60,56,29,31,41,83,1.82],null,'oh'],['opus','Xhigh',[56,1761,1829,65,60,65,58,27,32,43,85,3.46],95.1,'oh'],['opus','Max',[58,1801,1866,70,60,67,61,26,32,46,85,5.98],null,'ol']];
const keys=['index','brief','gdp','auto','terminal','sci','hle','pdf','crit','omni','lcr','cost'];
const data=raw.map(([model,level,vals,game,source],order)=>({model,level,game,source,order,...Object.fromEntries(keys.map((k,i)=>[k,vals?.[i]??null]))}));
const metrics={index:['AA Index','points'],cost:['AA cost / task','USD ↓'],game:['GameBench 2','relative score'],terminal:['Terminal-Bench 4.0','%'],sci:['SciCode¹','%'],hle:["Humanity’s Last Exam",'%'],crit:['CritPt','%'],lcr:['AA-LCR v1.1','%'],brief:['AA-Briefcase v1.1','Elo'],gdp:['GDPval-AA v2.1','Elo'],auto:['AutomationBench-AA','%'],pdf:['GDP.pdf','%'],omni:['AA-Omniscience','index']};
const views={overview:['index','cost','game'],coding:['terminal','sci','hle','crit','lcr'],work:['brief','gdp','auto','pdf','omni']};
let view='overview',sort='order',direction=1;
function fmt(value,key){return value===null?'—':key==='cost'?'$'+value.toFixed(2):metrics[key][1]==='%'?value+'%':key==='game'?value.toFixed(1):String(value)}
function render(){const filtered=data.filter(d=>filter.value==='all'||filter.value===d.model);const rows=[...filtered].sort((a,b)=>{if(a[sort]===null)return b[sort]===null?0:1;if(b[sort]===null)return -1;return (a[sort]-b[sort])*direction});const cols=views[view];document.querySelector('#head').innerHTML='<tr><th scope="col">Model</th><th scope="col">Reasoning</th>'+cols.map(k=>`<th scope="col" aria-sort="${sort===k?(direction===1?'ascending':'descending'):'none'}"><button data-sort="${k}">${metrics[k][0]} ${sort===k?(direction===1?'↑':'↓'):'↕'}<br><span>${metrics[k][1]}</span></button></th>`).join('')+'</tr>';document.querySelector('#rows').innerHTML=rows.map(d=>`<tr><td><span class="dot" style="--color:${models[d.model].color}"></span>${models[d.model].name}${d.model==='opus'?' <span class="small" title="AA Default Fallback configuration">*</span>':''}<a class="source" href="${sources[d.source]||models[d.model].game}" target="_blank" rel="noopener noreferrer" aria-label="Source for ${models[d.model].name} ${d.level}">↗</a></td><td class="level">${d.level}</td>${cols.map(k=>{const nums=filtered.map(x=>x[k]).filter(x=>x!==null);const best=k==='cost'?Math.min(...nums):Math.max(...nums);return `<td class="${d[k]===null?'na':d[k]===best?'best':''}"${d[k]===null?' title="No verified result in sources reviewed"':''}>${fmt(d[k],k)}</td>`}).join('')}</tr>`).join('');document.querySelector('#count').textContent=`${rows.length} configurations · ${rows.filter(d=>d.index!==null).length} with verified AA results`;document.querySelector('#table-caption').textContent=view==='overview'?'AA composite performance, benchmark cost, and a separate game-program benchmark.':view==='coding'?'AA coding, expert reasoning, physics and long-context evaluations. Higher is better. ¹ SciCode is marked “Under review” by AA.':'AA agentic work, automation, document reasoning and knowledge reliability. Higher is better. Omniscience ranges from −100 to 100.';document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{direction=sort===b.dataset.sort?-direction:(b.dataset.sort==='cost'?1:-1);sort=b.dataset.sort;render()})}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;sort='order';direction=1;document.querySelectorAll('[data-view]').forEach(t=>{t.classList.toggle('active',t===b);t.setAttribute('aria-pressed',String(t===b))});render()});const filter=document.querySelector('#filter');filter.onchange=render;
document.querySelector('#charts').innerHTML=Object.entries(models).map(([id,m])=>{const points=data.filter(d=>d.model===id),n=points.length;const x=i=>30+i*(270/(n-1)),y=v=>145-v*1.85;const known=points.map((p,i)=>p.index===null?null:{...p,x:x(i),y:y(p.index)});const segments=known.slice(1).map((p,i)=>p&&known[i]?`<line x1="${known[i].x}" y1="${known[i].y}" x2="${p.x}" y2="${p.y}" stroke="${m.color}" stroke-width="2"/>`:'').join('');return `<article class="chart"><div class="modelhead"><h3><span class="dot" style="--color:${m.color}"></span>${m.name}${id==='opus'?' <span title="AA Default Fallback configuration">*</span>':''}</h3><span>${m.provider}</span></div><svg viewBox="0 0 330 183" role="img" aria-label="${m.name}: ${points.map(p=>p.level+' '+(p.index??'unavailable')).join(', ')}">${[0,20,40,60].map(v=>`<line x1="28" y1="${y(v)}" x2="307" y2="${y(v)}" stroke="#dcded5" stroke-width=".7"/><text x="1" y="${y(v)+3}" fill="#888c80" font-size="9" font-family="Arial">${v}</text>`).join('')}${segments}${points.map((p,i)=>`<text x="${x(i)}" y="171" text-anchor="middle" fill="#6f716b" font-size="10" font-family="Arial">${p.level}</text>${p.index===null?`<text x="${x(i)}" y="111" text-anchor="middle" fill="#94978d" font-size="13">—</text>`:`<circle cx="${x(i)}" cy="${y(p.index)}" r="3.4" fill="${m.color}"/><text x="${x(i)}" y="${y(p.index)-11}" text-anchor="middle" fill="${m.color}" font-size="13" font-family="Arial">${p.index}</text>`}`).join('')}</svg></article>`}).join('');
render();
</script>
</body></html>
